<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UGAEGQfb.py - Language Selection</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #d6d6d6;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .page {
            width: 700px;
            margin: 80px auto;
            background: #fff;
            border: 1px solid #999;
            box-shadow: 0 0 8px #999;
        }

        header {
            padding: 25px;
            background: linear-gradient(#444, #222);
            color: white;
            border-bottom: 1px solid #111;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            text-shadow: 1px 1px 2px #000;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
            font-size: 13px;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        .box {
            border: 1px solid #aaa;
        }

        .box-title {
            padding: 9px;
            background: linear-gradient(#eeeeee, #cccccc);
            border-bottom: 1px solid #aaa;
            font-size: 18px;
            font-weight: bold;
        }

        .box-content {
            padding: 25px;
        }

        .language {
            display: inline-block;
            width: 180px;
            margin: 8px;
            padding: 15px 10px;

            background: linear-gradient(#fff, #ddd);
            border: 1px solid #888;

            color: #222;
            text-decoration: none;
            font-size: 15px;
        }

        .language:hover {
            background: #fff;
        }

        .language small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 11px;
        }

        #detected {
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }

        footer {
            padding: 12px;
            background: #ddd;
            border-top: 1px solid #aaa;
            text-align: center;
            color: #555;
            font-size: 11px;
        }
    </style>

    <script>
        function detectLanguage() {
            const language = (
                navigator.language ||
                navigator.userLanguage ||
                "en"
            ).toLowerCase();

            const detected = document.getElementById("detected");

            if (language.startsWith("pl")) {
                detected.innerHTML =
                    "Polish detected. Redirecting...";

                setTimeout(function () {
                    window.location.href = "documentation/pl/";
                }, 700);

                return;
            }

            if (language.startsWith("en")) {
                detected.innerHTML =
                    "English detected. Redirecting...";

                setTimeout(function () {
                    window.location.href = "documentation/en/";
                }, 700);

                return;
            }

            detected.innerHTML =
                "Language not detected. Please select a language.";
        }

        window.onload = detectLanguage;
    </script>
</head>

<body>

<div class="page">

    <header>
        <h1>UGAEGQfb.py</h1>
        <p>Local Python text encryption tool</p>
    </header>

    <div class="content">

        <div class="box">

            <div class="box-title">
                Select Language
            </div>

            <div class="box-content">

                <p>
                    Choose the language for the documentation.
                </p>

                <a class="language" href="documentation/pl/">
                    Polski
                    <small>Polish documentation</small>
                </a>

                <a class="language" href="documentation/en/">
                    English
                    <small>English documentation</small>
                </a>

                <div id="detected">
                    Detecting browser language...
                </div>

            </div>

        </div>

    </div>

    <footer>
        UGAEGQfb.py &copy; 2026
    </footer>

</div>

</body>
</html>
